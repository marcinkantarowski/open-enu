server {
    listen 80 default_server;
    server_name _;
    root /app/public;

    # Symfony front controller: everything that is not a real file goes to index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        # Uploads and long-running API calls; the app enforces its own limits.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        internal;
    }

    # A .php file other than the front controller is never intentional.
    location ~ \.php$ { return 404; }

    client_max_body_size 32m;

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
