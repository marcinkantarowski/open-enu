; Production PHP. The dev counterpart trades all of this for feedback speed.
memory_limit = 256M
max_execution_time = 30
expose_php = Off

; The single biggest difference from dev. `validate_timestamps=0` means PHP
; never stats a file again after the first request - which is why a deploy must
; recreate the container rather than swap files underneath it.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload = /app/var/cache/prod/App_KernelProdContainer.preload.php
opcache.preload_user = www-data

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Errors to the log, never to the response. A stack trace in an HTTP body is a
; map of the filesystem handed to whoever triggered it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Uploads are validated in the application too; this is the outer bound.
upload_max_filesize = 32M
post_max_size = 33M

; Hardening from the PHP security release of 2026-10-21 (CVE-2026-109618 /
; CVE-2026-109619, unauthenticated RCE through request handling). The patched
; image is the fix; these stay: session upload progress is the path validated
; against php-fpm and nothing here uses it, shallower input nesting bounds the
; multipart work a request can demand.
session.upload_progress.enabled = 0
max_input_nesting_level = 16
