; Development PHP settings. Production overrides arrive with Phase 8.
memory_limit = 512M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M
date.timezone = UTC

; Full errors to stdout - docker logs is the dev error console.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; Opcache on, but revalidating, so an edited file takes effect immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug is enabled by XDEBUG_MODE at runtime, never here.
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger

; Hardening from the PHP security release of 2026-10-21 (CVE-2026-109618 /
; CVE-2026-109619, unauthenticated RCE through request handling). The patched
; image is the fix; these stay: session upload progress is the path validated
; against php-fpm and nothing here uses it, shallower input nesting bounds the
; multipart work a request can demand.
session.upload_progress.enabled = 0
max_input_nesting_level = 16
