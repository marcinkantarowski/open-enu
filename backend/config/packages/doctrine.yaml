doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

        # Tables owned by infrastructure rather than by a module's entities.
        # Without this, `doctrine:schema:validate` reports the schema as out of
        # sync forever - it compares the database against the mapped entities,
        # and these tables are mapped by nothing.
        #
        #   messenger_messages           the transactional outbox (ADR-0009)
        #   search_index                 the kernel's full-text index (ADR-0021)
        #
        # doctrine_migration_versions is deliberately NOT filtered here.
        # DoctrineMigrationsBundle excludes its own table from schema:validate,
        # and hiding it from the schema manager instead breaks Migrations itself:
        # its "does my table exist?" check goes through the same filtered
        # introspection, so it concludes the table is missing and tries to create
        # one that is already there.
        schema_filter: ~^(?!messenger_messages|search_index)~
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        # Module entity mappings are PREPENDED by the kernel - one per enabled
        # module, pointing at that module's own Entity/ directory. That is what
        # keeps a module's schema inside the module, and what makes the "no
        # cross-module ORM associations" rule enforceable rather than
        # aspirational (ADR-0002).
        #
        # auto_mapping is off deliberately: with it on, Doctrine adds a
        # catch-all mapping for the whole app that would swallow module entities
        # and quietly defeat the per-module boundary.
        auto_mapping: false
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
