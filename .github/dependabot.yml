# Dependency updates, monthly, grouped.
#
# Grouped deliberately: twenty single-dependency pull requests a week is a
# notification stream people mute, and a muted update stream is how a project
# ends up three majors behind on the thing with the CVE. One PR per ecosystem
# per month is a thing somebody actually reviews - and each one is a full CI
# run. Security updates do not wait for the schedule: Dependabot opens those
# as soon as an advisory lands, whatever the interval says.
#
# Every one of them runs `make ci`, which is what makes accepting them cheap.
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # The app is on Symfony 7.4 (LTS) - composer.json pins it with Flex's
      # `extra.symfony.require: 7.4.*`. Dependabot runs composer without
      # plugins, so it never sees that pin: it once bumped monolog-bundle to 4
      # and phpunit-bridge to 8.1 and dragged var-exporter, http-foundation and
      # six other components to 8.0 beside a 7.4 kernel. Doctrine's lazy ghosts
      # were gone and the first migration failed. The real fence is the
      # `conflict` list in backend/composer.json (make symfony-check); this
      # only spares us pull requests for a major that cannot resolve. Moving to
      # 8 is a deliberate upgrade of the whole framework, not a monthly bump.
      - dependency-name: 'symfony/*'
        update-types: ['version-update:semver-major']
    groups:
      symfony:
        patterns: ['symfony/*']
      backend:
        patterns: ['*']
        exclude-patterns: ['symfony/*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # 13.x publishes no prebuilt binaries, so `npm install` compiles it with
      # node-gyp - and node:22-alpine has no python, make or g++. Lift this once
      # a 13.x release carries `node-v127-linuxmusl-x64` again.
      - dependency-name: better-sqlite3
        versions: ['>=13']
      # TypeScript 7 is the native (Go) compiler and has no JavaScript API.
      # @typescript-eslint reads that API, and @nuxtjs/i18n loads it through
      # unplugin-vue-i18n, so `nuxt prepare` dies in postinstall ("Cannot read
      # properties of undefined (reading 'Intrinsic')"). Lift this when
      # @typescript-eslint supports 7.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', '@nuxtjs/*', 'vue', 'vue-router']
      frontend:
        patterns: ['*']
        exclude-patterns: ['nuxt', '@nuxt/*', '@nuxtjs/*', 'vue', 'vue-router']

  # Base images: the ones a `docker compose build` pulls, and the ones the
  # production stack pins. An unpinned image is already a build failure here
  # (`make prod-check`), so these updates are the only way they move.
  - package-ecosystem: docker
    directories:
      - /docker/api
      - /docker/node
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # The images compose pulls directly - Postgres, Redis, Mercure, Mailpit, the
  # edge's Traefik. The `docker` entry above reads Dockerfiles only, so these
  # sat still: Mailpit ten minors behind, Traefik four patches, and Redis on 8
  # in dev but 7.4 in prod without anyone deciding that. The Playwright image
  # is tagged from a variable (make e2e) and is moved by the npm update.
  - package-ecosystem: docker-compose
    directories:
      - /docker
      - /docker/edge
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # A Postgres major needs a dump and restore of every database; Mercure
      # 1.0 changed the protocol (URL Pattern topics). Both are deliberate
      # migrations, not monthly bumps.
      - dependency-name: 'pgvector/pgvector'
        update-types: ['version-update:semver-major']
      - dependency-name: 'dunglas/mercure'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
